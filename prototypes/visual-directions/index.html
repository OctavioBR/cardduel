<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Duel: visual directions (prototype)</title>
<!--
  Throwaway prototype for issue #32: the same mid-Match stage in three original looks.
  Not part of the app. Open this file in a browser; switch look and size with the bar.
  ?look=ink|glass|modern&size=desktop|phone picks a view directly (used for screenshots).
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #0b0c0f; }

  .bar { position: fixed; top: 0; left: 0; right: 0; z-index: 5; display: flex; gap: 8px; align-items: center;
    flex-wrap: wrap; padding: 8px 12px; background: #000c; color: #fff; font-size: 13px; }
  .bar button { font: inherit; color: #fff; background: #ffffff1a; border: 1px solid #ffffff40; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  .bar button[aria-pressed="true"] { background: #fff; color: #000; }
  .bar .sep { width: 1px; height: 20px; background: #ffffff40; margin: 0 4px; }
  body.shot .bar { display: none; }

  .viewport { position: fixed; inset: 0; overflow: hidden; display: grid; place-items: center; }
  body:not(.shot) .viewport { top: 44px; }
  .device { position: relative; overflow: hidden; background: #000; }
  .device.phone { width: 844px; height: 390px; border-radius: 28px; outline: 10px solid #222; }
  .device.desktop { width: 1280px; height: 720px; }
  .stage { position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px; transform-origin: center; }

  /* ---------- Shared stage layout (logical 1280x720, ADR-0006) ---------- */
  .board { position: absolute; inset: 0; display: grid; grid-template-columns: 236px 1fr 118px; grid-template-rows: 1fr 150px; }
  .side { grid-column: 1; grid-row: 1 / span 2; display: flex; flex-direction: column; gap: 10px; padding: 12px; }
  .field { grid-column: 2; grid-row: 1; display: flex; flex-direction: column; gap: 5px; padding: 10px 12px 6px; }
  .piles { grid-column: 3; grid-row: 1 / span 2; display: flex; flex-direction: column; justify-content: space-between; padding: 12px 10px; }
  .hand { grid-column: 2; grid-row: 2; display: flex; gap: 6px; align-items: center; padding: 0 12px; }
  .row { position: relative; display: grid; grid-template-columns: 54px 50px 1fr; align-items: center; height: 82px; }
  .row .horn { width: 44px; height: 62px; margin-left: 6px; display: grid; place-items: center; }
  .row .label { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .row .units { display: flex; gap: 4px; padding: 0 8px; }
  .divider { height: 0; }
  .player { display: grid; grid-template-columns: 64px 1fr auto; gap: 8px; align-items: center; padding: 8px; }
  .leader { width: 64px; height: 84px; display: grid; place-items: center; text-align: center; font-size: 10px; line-height: 1.15; padding: 4px; }
  .who { display: flex; flex-direction: column; gap: 3px; font-size: 12px; }
  .who strong { font-size: 15px; }
  .gems { display: flex; gap: 5px; }
  .gem { width: 13px; height: 13px; }
  .total { font-size: 34px; font-weight: 800; min-width: 52px; text-align: right; }
  .weather { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 8px; padding: 10px; }
  .weather .cards { display: flex; gap: 6px; justify-content: center; }
  .pass { margin-top: auto; font: inherit; font-weight: 700; padding: 10px; cursor: pointer; }
  .pile { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; }
  .pile .stack { width: 70px; height: 96px; display: grid; place-items: center; font-weight: 800; font-size: 20px; }

  .token { position: relative; width: 56px; height: 70px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 4px 2px; }
  .token .s { font-weight: 800; font-size: 19px; line-height: 1; }
  .token .ic { display: flex; gap: 2px; height: 13px; font-size: 10px; line-height: 13px; overflow: hidden; }
  .token .n { font-size: 8.5px; text-align: center; line-height: 1.05; max-height: 18px; overflow: hidden; }
  .token.low .s { color: var(--lowered); }
  .token.high .s { color: var(--raised); }
  .card { color: inherit; font-family: inherit; cursor: pointer; text-align: inherit; position: relative; width: 92px; height: 128px; display: flex; flex-direction: column; padding: 5px; gap: 4px; }
  .card .top { display: flex; justify-content: space-between; align-items: center; }
  .card .art { flex: 1; }
  .card .nm { font-size: 10.5px; font-weight: 700; line-height: 1.1; text-align: center; }
  .card .tx { font-size: 8.5px; line-height: 1.15; text-align: center; opacity: .8; height: 20px; overflow: hidden; }
  .card.selected { transform: translateY(-14px); }
  .ghost { opacity: .55; }
  .mini { width: 34px; height: 46px; display: grid; place-items: center; font-size: 8px; text-align: center; line-height: 1; padding: 2px; }
  svg.icon { width: 16px; height: 16px; display: block; }
  .row .label svg.icon { width: 22px; height: 22px; }
  .row .score { font-weight: 800; font-size: 18px; }
  .preview-delta { position: absolute; top: -8px; right: -8px; font-size: 10px; font-weight: 800; padding: 1px 4px; border-radius: 8px; }

  /* ---------- Look 1: Ink and parchment ---------- */
  .look-ink { --paper: #f2e8d5; --paper2: #e8dbc2; --ink: #2a241d; --ink2: #6b5d4c; --swarm: #b5651d; --court: #2f4f8f;
    --raised: #1f7a3a; --lowered: #a0281c; color: var(--ink); background: var(--paper);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
  .look-ink .side, .look-ink .piles { background: var(--paper2); }
  .look-ink .side { border-right: 2px solid var(--ink); }
  .look-ink .piles { border-left: 2px solid var(--ink); }
  .look-ink .hand { border-top: 2px solid var(--ink); background: var(--paper2); }
  .look-ink .row { border: 1.5px dashed var(--ink2); border-radius: 4px; }
  .look-ink .row.opp { background: color-mix(in srgb, var(--court) 7%, transparent); }
  .look-ink .row.you { background: color-mix(in srgb, var(--swarm) 8%, transparent); }
  .look-ink .row.weathered { background-image: repeating-linear-gradient(135deg, transparent 0 9px, #2a241d14 9px 10px); }
  .look-ink .row.target { border: 2.5px solid var(--ink); }
  .look-ink .divider { border-top: 3px double var(--ink); margin: 2px 0; }
  .look-ink .horn { border: 1.5px dotted var(--ink2); border-radius: 3px; }
  .look-ink .token, .look-ink .card, .look-ink .leader, .look-ink .mini, .look-ink .stack { background: #fbf6ea; border: 2px solid var(--ink); border-radius: 3px; }
  .look-ink .token.f-swarm, .look-ink .card.f-swarm, .look-ink .leader.f-swarm { box-shadow: inset 0 6px 0 var(--swarm); }
  .look-ink .token.f-court, .look-ink .card.f-court, .look-ink .leader.f-court { box-shadow: inset 0 6px 0 var(--court); }
  .look-ink .token.f-neutral, .look-ink .card.f-neutral { box-shadow: inset 0 6px 0 #8b8172; }
  .look-ink .hero .s { border: 2px solid var(--ink); border-radius: 50%; width: 26px; height: 26px; display: grid; place-items: center; font-size: 15px; }
  .look-ink .card .art { border: 1px solid var(--ink2); background: repeating-linear-gradient(45deg, transparent 0 5px, #6b5d4c22 5px 6px); }
  .look-ink .gem { border: 2px solid var(--ink); transform: rotate(45deg); }
  .look-ink .gem.on { background: var(--ink); }
  .look-ink .pass { background: var(--paper); color: var(--ink); border: 2px solid var(--ink); border-radius: 3px; }
  .look-ink .player.you { border-left: 6px solid var(--swarm); }
  .look-ink .player.opp { border-left: 6px solid var(--court); }
  .look-ink .player.active { outline: 2px solid var(--ink); }
  .look-ink .preview-delta { background: var(--raised); color: #fff; }
  .look-ink svg.icon { stroke: var(--ink); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .look-ink .sel { outline: 3px solid var(--ink); outline-offset: 2px; }
  .look-ink .doomed { box-shadow: 0 0 0 3px var(--lowered); }

  /* ---------- Look 2: Night glass ---------- */
  .look-glass { --bg: #0f141d; --glass: #ffffff0d; --edge: #ffffff1f; --text: #e8eef7; --muted: #8e9bb0;
    --swarm: #f2b134; --court: #7d8cff; --raised: #5ce39a; --lowered: #ff7a6b; color: var(--text);
    background: radial-gradient(1200px 600px at 60% 40%, #1a2333, var(--bg)); }
  .look-glass .side, .look-glass .piles, .look-glass .hand { background: #0b0f16cc; backdrop-filter: blur(6px); }
  .look-glass .side { border-right: 1px solid var(--edge); }
  .look-glass .piles { border-left: 1px solid var(--edge); }
  .look-glass .hand { border-top: 1px solid var(--edge); }
  .look-glass .row { background: var(--glass); border: 1px solid var(--edge); border-radius: 10px; }
  .look-glass .row.opp { box-shadow: inset 0 0 22px color-mix(in srgb, var(--court) 22%, transparent), 0 0 0 1px color-mix(in srgb, var(--court) 30%, transparent); }
  .look-glass .row.you { box-shadow: inset 0 0 22px color-mix(in srgb, var(--swarm) 20%, transparent), 0 0 0 1px color-mix(in srgb, var(--swarm) 28%, transparent); }
  .look-glass .row.weathered { background: linear-gradient(90deg, #9fd8ff1f, #9fd8ff08); }
  .look-glass .row.target { box-shadow: 0 0 0 2px var(--swarm), 0 0 26px color-mix(in srgb, var(--swarm) 60%, transparent); }
  .look-glass .divider { height: 2px; background: linear-gradient(90deg, transparent, #ffffff55, transparent); margin: 2px 0; }
  .look-glass .horn { border: 1px dashed var(--edge); border-radius: 8px; }
  .look-glass .token, .look-glass .card, .look-glass .leader, .look-glass .mini, .look-glass .stack { background: #182131; border: 1px solid var(--edge); border-radius: 8px; }
  .look-glass .f-swarm { border-color: color-mix(in srgb, var(--swarm) 70%, transparent) !important; box-shadow: 0 0 10px color-mix(in srgb, var(--swarm) 30%, transparent); }
  .look-glass .f-court { border-color: color-mix(in srgb, var(--court) 70%, transparent) !important; box-shadow: 0 0 10px color-mix(in srgb, var(--court) 30%, transparent); }
  .look-glass .hero .s { color: #fff; text-shadow: 0 0 8px #fff; }
  .look-glass .card .art { border-radius: 6px; background: linear-gradient(160deg, #ffffff12, #ffffff03); }
  .look-glass .gem { border-radius: 50%; border: 1px solid var(--edge); }
  .look-glass .gem.on { background: radial-gradient(circle at 35% 35%, #fff, #9fe3ff 40%, #3a88c9); box-shadow: 0 0 8px #9fe3ff; }
  .look-glass .pass { color: var(--text); background: #ffffff12; border: 1px solid var(--edge); border-radius: 10px; }
  .look-glass .player { border-radius: 10px; background: var(--glass); }
  .look-glass .player.you { box-shadow: inset 3px 0 0 var(--swarm); }
  .look-glass .player.opp { box-shadow: inset 3px 0 0 var(--court); }
  .look-glass .player.active { outline: 1px solid #ffffffaa; }
  .look-glass .who span { color: var(--muted); }
  .look-glass .preview-delta { background: var(--raised); color: #06210f; }
  .look-glass svg.icon { stroke: currentColor; fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 3px currentColor); }
  .look-glass .row.opp .label { color: var(--court); }
  .look-glass .row.you .label { color: var(--swarm); }
  .look-glass .sel { box-shadow: 0 0 0 2px #fff, 0 0 18px #fff8; }
  .look-glass .doomed { box-shadow: 0 0 0 2px var(--lowered), 0 0 16px var(--lowered); }

  /* ---------- Look 3: Clean modern ---------- */
  .look-modern { --bg: #16171b; --panel: #1e2026; --line: #2c2f37; --text: #f3f4f6; --muted: #9ca3af;
    --swarm: #f0662e; --court: #1d6fc2; --raised: #34d399; --lowered: #f87171; color: var(--text); background: var(--bg);
    font-family: "Inter", system-ui, sans-serif; }
  .look-modern .side, .look-modern .piles { background: var(--panel); }
  .look-modern .hand { background: var(--panel); border-top: 1px solid var(--line); }
  .look-modern .row { background: #1b1d22; border-radius: 6px; }
  .look-modern .row.opp .label { box-shadow: inset 4px 0 0 var(--court); }
  .look-modern .row.you .label { box-shadow: inset 4px 0 0 var(--swarm); }
  .look-modern .row.weathered { background: #1c2430; }
  .look-modern .row.target { outline: 2px solid var(--text); }
  .look-modern .divider { height: 1px; background: var(--line); margin: 3px 0; }
  .look-modern .horn { background: #23262d; border-radius: 4px; }
  .look-modern .token, .look-modern .card, .look-modern .leader, .look-modern .mini, .look-modern .stack { background: #2a2d35; border-radius: 6px; }
  .look-modern .f-swarm { box-shadow: inset 0 -4px 0 var(--swarm); }
  .look-modern .f-court { box-shadow: inset 0 -4px 0 var(--court); }
  .look-modern .f-neutral { box-shadow: inset 0 -4px 0 #6b7280; }
  .look-modern .token .s { font-size: 24px; letter-spacing: -0.03em; }
  .look-modern .hero .s { color: #111; background: var(--text); border-radius: 4px; padding: 1px 4px; font-size: 18px; }
  .look-modern .card .art { background: #33363f; border-radius: 4px; }
  .look-modern .gem { border-radius: 3px; background: var(--line); }
  .look-modern .gem.on { background: var(--text); }
  .look-modern .pass { background: var(--text); color: #111; border: 0; border-radius: 6px; }
  .look-modern .total { font-size: 46px; letter-spacing: -0.04em; }
  .look-modern .row .score { font-size: 24px; }
  .look-modern .player.you .total { color: var(--swarm); }
  .look-modern .player.opp .total { color: var(--court); }
  .look-modern .player.active { background: #ffffff0a; border-radius: 6px; }
  .look-modern .who span { color: var(--muted); }
  .look-modern .preview-delta { background: var(--raised); color: #052e1c; }
  .look-modern svg.icon { fill: currentColor; stroke: none; }
  .look-modern .row .label { color: var(--muted); }
  .look-modern .sel { outline: 2px solid var(--text); outline-offset: 2px; }
  .look-modern .doomed { box-shadow: 0 0 0 2px var(--lowered); }
</style>
</head>
<body>
<div class="bar" role="toolbar" aria-label="Prototype controls">
  <strong>Card Duel · visual directions</strong>
  <span class="sep"></span>
  <button type="button" data-look="ink">Ink &amp; parchment</button>
  <button type="button" data-look="glass">Night glass</button>
  <button type="button" data-look="modern">Clean modern</button>
  <span class="sep"></span>
  <button type="button" data-size="desktop">Desktop 1280×720</button>
  <button type="button" data-size="phone">Phone landscape 844×390</button>
</div>
<div class="viewport"><div class="device desktop" id="device"><div class="stage" id="stage"></div></div></div>

<script>
// Row icons per look: original shapes (shield, fletched arrow, stone tower; target and
// rampart; geometric marks). Inline SVG, so they recolour with the look.
const ICONS = {
  ink: {
    close: '<path d="M8 1.6c2.2 1.3 4.2 1.6 5.6 1.5.2 5.4-1.7 9.2-5.6 11.3C4.1 12.3 2.2 8.5 2.4 3.1 3.8 3.2 5.8 2.9 8 1.6z"/><path d="M8 4.2v7.2M5.4 7.4h5.2"/>',
    ranged: '<path d="M2.2 13.8 12.6 3.4"/><path d="M12.6 3.4 9.4 3.9M12.6 3.4 12.1 6.6"/><path d="M3.4 10.9 2 12.6M4.6 12.1 3.3 13.9M2.2 13.8 4.6 13.9 3.9 11.5"/>',
    siege: '<path d="M3.5 14.5V5.2h9v9.3"/><path d="M3.5 5.2V2.4h2v1.4h1.6V2.4h1.8v1.4h1.6V2.4h2v2.8"/><path d="M6.8 14.5v-3.2a1.2 1.2 0 0 1 2.4 0v3.2M2.2 14.5h11.6"/>',
  },
  glass: {
    close: '<path d="M8 1.8 13.5 4v4.3c0 3-2.3 5.2-5.5 6.1-3.2-.9-5.5-3.1-5.5-6.1V4z"/><path d="m5.6 7.6 2.4 2.2 2.4-2.2"/>',
    ranged: '<circle cx="8" cy="8" r="5.6"/><circle cx="8" cy="8" r="2.4"/><path d="M8 .9v3M8 12.1v3M.9 8h3M12.1 8h3"/>',
    siege: '<path d="M1.8 14.2h12.4M3 14.2V7.4h10v6.8"/><path d="M3 7.4V4.6h1.8v1.4h1.6V4.6h3.2v1.4h1.6V4.6H13v2.8"/>',
  },
  modern: {
    close: '<rect x="3" y="3" width="10" height="10" rx="1.5"/>',
    ranged: '<path d="M8 2.4 14 13.2H2z"/>',
    siege: '<path d="M8 1.8 13.6 5v6L8 14.2 2.4 11V5z"/>',
  },
};
const ROWS = ["close", "ranged", "siege"];
const ROW_NAME = { close: "Close", ranged: "Ranged", siege: "Siege" };
const ABILITY_ICON = { bond: "∞", morale: "+", horn: "♪", medic: "✚", muster: "⁂", spy: "◉", scorch: "✶", agile: "⇄" };

// A mid-Match board in Round 2: you (Swarm) against the opponent (Court).
const STATE = {
  round: 2,
  opp: {
    name: "Opponent", leader: "The Spymaster", faction: "court", gems: 1, hand: 6, deck: 14, discard: 9, score: 0,
    rows: {
      siege: { units: [["Royal Physician", 3, 3, ["medic"]], ["Ballista Crew", 6, 12, ["bond"]], ["Ballista Crew", 6, 12, ["bond"]]] },
      ranged: { units: [["Crossbow Marksman", 4, 4, []], ["Tower Archer", 5, 5, []], ["Vesper, the Spymistress", 10, 10, [], true]] },
      close: { units: [["Halberd Guard", 4, 1, []], ["Palace Champion", 9, 1, []], ["Infiltrator Larva", 2, 1, ["spy"], false, "swarm"]], weathered: true },
    },
  },
  you: {
    name: "You", leader: "Queen of the Deep Hive", faction: "swarm", gems: 2, hand: 8, deck: 11, discard: 6, score: 0,
    rows: {
      close: { units: [["Carapace Guard", 4, 3, ["bond"]], ["Carapace Guard", 4, 3, ["bond"]], ["Carapace Guard", 4, 3, ["bond"]], ["The Hollow Colossus", 12, 12, [], true]], weathered: true },
      ranged: { units: [["Hive Drone", 2, 3, ["muster"]], ["Hive Drone", 2, 3, ["muster"]], ["Hive Drone", 2, 3, ["muster"]], ["Chitter Herald", 2, 2, ["morale"]], ["Drone Warden", 6, 7, ["muster"]]], target: true },
      siege: { units: [["Tunnel Burrower", 3, 6, ["muster"]], ["Tunnel Burrower", 3, 6, ["muster"]], ["Spore Lobber", 8, 16, []]], horn: "War Drum" },
    },
  },
  weather: ["Black Ice"],
  hand: [
    ["Needle Stinger", 5, "ranged", [], "swarm"], ["Wildfire", null, null, ["scorch"], "neutral", "Destroys the strongest non-Hero Units."],
    ["Lurking Mantis", 9, "close", [], "swarm"], ["Skitterling", 3, "close", ["agile"], "swarm"],
    ["Brood Tender", 3, "siege", ["medic"], "swarm"], ["Break in the Clouds", null, null, [], "neutral", "Discards every Weather card."],
    ["Glasswing", 7, "ranged", [], "swarm"], ["Straw Double", null, null, [], "neutral", "Swap with one of your Units."],
  ],
  selected: 0,
};
for (const side of [STATE.opp, STATE.you]) {
  side.score = ROWS.reduce((n, r) => n + side.rows[r].units.reduce((m, u) => m + u[2], 0), 0);
}

let look = "ink";
let size = "desktop";

function icon(row) {
  return `<svg class="icon" viewBox="0 0 16 16" aria-hidden="true">${ICONS[look][row]}</svg>`;
}
function abilityIcons(list) {
  return list.map((a) => `<span title="${a}">${ABILITY_ICON[a] ?? ""}</span>`).join("");
}
function token([name, printed, current, abilities, hero, owner], side, row, extra = "") {
  const faction = owner ?? side.faction;
  const cls = current > printed ? "high" : current < printed ? "low" : "";
  return `<div class="token f-${faction} ${hero ? "hero" : ""} ${cls} ${extra}" aria-label="${name}, Strength ${current}">
    <span class="s">${current}</span><span class="ic">${abilityIcons(abilities)}</span><span class="n">${name}</span></div>`;
}
function row(side, rowName, who) {
  const r = side.rows[rowName];
  const score = r.units.reduce((n, u) => n + u[2], 0);
  const preview = r.target ? `<span class="preview-delta">+5</span>` : "";
  const ghost = r.target ? token(["Needle Stinger", 5, 5, [], false, "swarm"], side, rowName, "ghost") : "";
  return `<section class="row ${who} ${r.weathered ? "weathered" : ""} ${r.target ? "target" : ""}" aria-label="${who === "you" ? "Your" : "Opponent's"} ${ROW_NAME[rowName]} Row">
    <div class="horn">${r.horn ? `<div class="mini f-neutral">${r.horn}</div>` : ""}</div>
    <div class="label">${icon(rowName)}<span class="score">${score}</span>${preview}</div>
    <div class="units">${r.units.map((u) => token(u, side, rowName, who === "opp" && rowName === "close" && u[0] === "Palace Champion" ? "" : "")).join("")}${ghost}</div>
  </section>`;
}
function player(side, who, active) {
  return `<div class="player ${who} ${active ? "active" : ""}">
    <div class="leader f-${side.faction}">${side.leader}</div>
    <div class="who"><strong>${side.name}</strong>
      <div class="gems" role="img" aria-label="${side.gems} Gems">${[0, 1].map((i) => `<span class="gem ${i < side.gems ? "on" : ""}"></span>`).join("")}</div>
      <span>Hand ${side.hand}</span></div>
    <div class="total">${side.score}</div>
  </div>`;
}
function handCard([name, strength, rowName, abilities, faction, text], i) {
  const sel = i === STATE.selected ? "selected sel" : "";
  return `<button type="button" class="card f-${faction} ${sel}" aria-label="${name}">
    <div class="top"><span class="token-s" style="font-weight:800;font-size:18px">${strength ?? ""}</span>${rowName ? icon(rowName) : `<span>${abilityIcons(abilities)}</span>`}</div>
    <div class="art"></div>
    <div class="nm">${name}</div>
    <div class="tx">${text ?? abilities.map((a) => a[0].toUpperCase() + a.slice(1)).join(", ")}</div>
  </button>`;
}

function render() {
  document.body.className = document.body.className.replace(/\blook-\S+/g, "").trim();
  const stage = document.getElementById("stage");
  stage.className = `stage look-${look}`;
  stage.innerHTML = `<div class="board">
    <aside class="side">
      ${player(STATE.opp, "opp", false)}
      <div class="weather"><div class="cards">${STATE.weather.map((w) => `<div class="mini f-neutral" style="width:58px;height:78px;font-size:10px">${w}<br>Close</div>`).join("")}</div>
        <div style="text-align:center;font-size:12px">Round ${STATE.round} · Your Turn</div></div>
      ${player(STATE.you, "you", true)}
      <button type="button" class="pass">Pass</button>
    </aside>
    <section class="field" aria-label="Battlefield">
      ${["siege", "ranged", "close"].map((r) => row(STATE.opp, r, "opp")).join("")}
      <div class="divider"></div>
      ${ROWS.map((r) => row(STATE.you, r, "you")).join("")}
    </section>
    <aside class="piles">
      <div class="pile"><div class="stack f-court">${STATE.opp.deck}</div>Deck</div>
      <div class="pile"><div class="stack">${STATE.opp.discard}</div>Discard</div>
      <div class="pile"><div class="stack">${STATE.you.discard}</div>Discard</div>
      <div class="pile"><div class="stack f-swarm">${STATE.you.deck}</div>Deck</div>
    </aside>
    <section class="hand" aria-label="Your hand">${STATE.hand.map(handCard).join("")}</section>
  </div>`;
  const device = document.getElementById("device");
  device.className = `device ${size}`;
  const w = size === "phone" ? 844 : 1280;
  const h = size === "phone" ? 390 : 720;
  const scale = Math.min(w / 1280, h / 720);
  stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
  for (const b of document.querySelectorAll("[data-look]")) b.setAttribute("aria-pressed", String(b.dataset.look === look));
  for (const b of document.querySelectorAll("[data-size]")) b.setAttribute("aria-pressed", String(b.dataset.size === size));
}

const params = new URLSearchParams(location.search);
look = params.get("look") ?? look;
size = params.get("size") ?? size;
if (params.has("shot")) document.body.classList.add("shot");
document.querySelector(".bar").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.look) look = b.dataset.look;
  if (b.dataset.size) size = b.dataset.size;
  render();
});
render();
</script>
</body>
</html>
