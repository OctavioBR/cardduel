name: PR Preview
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}
permissions:
  contents: read
  pull-requests: write
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
  PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
  PREVIEW_CLERK_PUBLISHABLE_KEY: ${{ vars.PREVIEW_CLERK_PUBLISHABLE_KEY }}
  PREVIEW_CLERK_SECRET_KEY: ${{ secrets.PREVIEW_CLERK_SECRET_KEY }}
  COMMENT_MARKER: "<!-- pr-preview sticky comment -->"
jobs:
  preview:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          node-version-file: .nvmrc
          cache: true
          require-lockfile: true
      - name: Check the PR Preview settings
        run: |
          test -n "$PRODUCTION_URL" || { echo "::error::Set repository variable PRODUCTION_URL."; exit 1; }
          case "$PREVIEW_CLERK_PUBLISHABLE_KEY" in
            pk_test_*) ;;
            *) echo "::error::Set repository variable PREVIEW_CLERK_PUBLISHABLE_KEY to the development Clerk instance's pk_test_ key."; exit 1 ;;
          esac
          case "$PREVIEW_CLERK_SECRET_KEY" in
            sk_test_*) ;;
            *) echo "::error::Set repository secret PREVIEW_CLERK_SECRET_KEY to the development Clerk instance's sk_test_ key."; exit 1 ;;
          esac
          # Origin pinning: this PR Preview allows exactly its own URL, never a wildcard.
          echo "PREVIEW_URL=https://$PREVIEW_NAME.${PRODUCTION_URL#https://}" >> "$GITHUB_ENV"
      - name: Build the client
        run: VITE_CLERK_PUBLISHABLE_KEY="$PREVIEW_CLERK_PUBLISHABLE_KEY" SITE_URL="$PREVIEW_URL" pnpm build
      - name: Apply this PR's D1 migrations to card-duel-preview
        working-directory: apps/worker
        run: pnpm preview:db:migrate
      - name: Create or update the PR Preview
        working-directory: apps/worker
        run: |
          secrets="$RUNNER_TEMP/preview-secrets.json"
          jq -n --arg key "$PREVIEW_CLERK_SECRET_KEY" '{CLERK_SECRET_KEY: $key}' > "$secrets"
          export WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/wrangler-output.jsonl"
          pnpm wrangler preview --name "$PREVIEW_NAME" \
            --var "CLERK_PUBLISHABLE_KEY:$PREVIEW_CLERK_PUBLISHABLE_KEY" \
            --var "APP_ORIGIN:$PREVIEW_URL" \
            --secrets-file "$secrets"
          rm "$secrets"
          urls=$(jq -r 'select(.type == "preview") | .preview_urls[]?' "$WRANGLER_OUTPUT_FILE_PATH")
          if ! grep -qxF "$PREVIEW_URL" <<< "$urls"; then
            echo "::error::Expected the PR Preview at $PREVIEW_URL, which APP_ORIGIN allows, but Cloudflare reported: ${urls:-no URLs}"
            exit 1
          fi
      - name: Check the PR Preview health route
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$PREVIEW_URL/api/health"; then exit 0; fi
            sleep 10
          done
          echo "::error::$PREVIEW_URL/api/health did not respond"
          exit 1
      - name: Post the PR Preview link
        uses: actions/github-script@v9
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const { COMMENT_MARKER, PREVIEW_URL, HEAD_SHA } = process.env;
            const body = [
              COMMENT_MARKER,
              `**PR Preview:** ${PREVIEW_URL}`,
              "",
              `Built from ${HEAD_SHA}. Sign in with the development Clerk instance.`,
            ].join("\n");
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (c) => c.user?.login === "github-actions[bot]" && c.body?.startsWith(COMMENT_MARKER),
            );
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
              core.info(`Edited comment ${existing.id}.`);
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
              core.info("Posted the PR Preview comment.");
            }

  delete:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          node-version-file: .nvmrc
          cache: true
          require-lockfile: true
      - name: Delete PR Preview
        working-directory: apps/worker
        run: |
          if output=$(pnpm wrangler preview delete --name "$PREVIEW_NAME" --skip-confirmation 2>&1); then
            echo "$output"
          elif grep -qi "not found" <<< "$output"; then
            echo "$output"
            echo "::notice::$PREVIEW_NAME had no PR Preview to delete."
          else
            echo "$output"
            exit 1
          fi
      - name: Update PR Preview comment
        uses: actions/github-script@v9
        with:
          script: |
            const { COMMENT_MARKER } = process.env;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (c) => c.user?.login === "github-actions[bot]" && c.body?.startsWith(COMMENT_MARKER),
            );
            if (!existing) {
              core.info("No PR Preview comment to update.");
              return;
            }
            await github.rest.issues.updateComment({
              ...context.repo,
              comment_id: existing.id,
              body: `${COMMENT_MARKER}\nPR Preview deleted.`,
            });
            core.info(`Edited comment ${existing.id}.`);
