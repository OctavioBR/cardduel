name: Deploy
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to deploy
        required: false
        default: main

concurrency: deploy-production
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/setup@v3
        with:
          node-version-file: .nvmrc
          cache: true
          require-lockfile: true
      - name: Build the client
        run: |
          test -n "$CLERK_PUBLISHABLE_KEY" || { echo "::error::Set CLERK_PUBLISHABLE_KEY before deploying Clerk authentication."; exit 1; }
          test -n "$PRODUCTION_URL" || { echo "::error::Set PRODUCTION_URL before deploying Clerk authentication."; exit 1; }
          VITE_CLERK_PUBLISHABLE_KEY="$CLERK_PUBLISHABLE_KEY" SITE_URL="$PRODUCTION_URL" pnpm build
      - name: Apply D1 migrations
        working-directory: apps/worker
        run: |
          if compgen -G "migrations/*.sql" > /dev/null; then
            pnpm wrangler d1 migrations apply DB --remote
          else
            echo "No migrations yet; nothing to apply."
          fi
      - name: Deploy the Worker
        working-directory: apps/worker
        run: pnpm wrangler deploy --var "CLERK_PUBLISHABLE_KEY:$CLERK_PUBLISHABLE_KEY" --var "APP_ORIGIN:$PRODUCTION_URL"
      - name: Check the deployed health route
        run: |
          if [ -z "$PRODUCTION_URL" ]; then
            echo "::warning::Repository variable PRODUCTION_URL is not set; skipping the health check."
            exit 0
          fi
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$PRODUCTION_URL/api/health"; then exit 0; fi
            sleep 5
          done
          echo "::error::$PRODUCTION_URL/api/health did not respond"
          exit 1
