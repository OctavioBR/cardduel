name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          node-version-file: .nvmrc
          cache: true
          require-lockfile: true
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          node-version-file: .nvmrc
          cache: true
          require-lockfile: true
      - name: Install Playwright Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Local Room and online end-to-end tests
        working-directory: apps/web
        run: pnpm e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7

  deploy-gate:
    needs: [check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - id: gate
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" = true ] && [ "$HAS_ACCOUNT" = true ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Cloudflare secrets are not set (see #6); skipping deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: deploy-gate
    if: needs.deploy-gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          node-version-file: .nvmrc
          cache: true
          require-lockfile: true
      - name: Build the client
        env:
          SITE_URL: ${{ vars.PRODUCTION_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
        run: |
          test -n "$VITE_CLERK_PUBLISHABLE_KEY" || { echo "::error::Set CLERK_PUBLISHABLE_KEY before deploying Clerk authentication."; exit 1; }
          test -n "$SITE_URL" || { echo "::error::Set PRODUCTION_URL before deploying Clerk authentication."; exit 1; }
          pnpm build
      - name: Verify Clerk secret
        working-directory: apps/worker
        run: |
          pnpm exec wrangler secret list > "$RUNNER_TEMP/worker-secrets.json"
          node --input-type=module -e 'import { readFileSync } from "node:fs"; const secrets = JSON.parse(readFileSync(process.argv[1], "utf8")); if (!secrets.some(secret => secret.name === "CLERK_SECRET_KEY")) { console.error("Set the Worker CLERK_SECRET_KEY before deploying."); process.exit(1); }' "$RUNNER_TEMP/worker-secrets.json"
      - name: Apply D1 migrations
        working-directory: apps/worker
        run: |
          if compgen -G "migrations/*.sql" > /dev/null; then
            pnpm wrangler d1 migrations apply DB --remote
          else
            echo "No migrations yet; nothing to apply."
          fi
      - name: Deploy the Worker
        working-directory: apps/worker
        env:
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          APP_ORIGIN: ${{ vars.PRODUCTION_URL }}
        run: pnpm wrangler deploy --var "CLERK_PUBLISHABLE_KEY:$CLERK_PUBLISHABLE_KEY" --var "APP_ORIGIN:$APP_ORIGIN"
      - name: Check the deployed health route
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          if [ -z "$PRODUCTION_URL" ]; then
            echo "::warning::Repository variable PRODUCTION_URL is not set; skipping the health check."
            exit 0
          fi
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$PRODUCTION_URL/api/health"; then exit 0; fi
            sleep 5
          done
          echo "::error::$PRODUCTION_URL/api/health did not respond"
          exit 1
